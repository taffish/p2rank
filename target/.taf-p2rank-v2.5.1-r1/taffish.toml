[package]
name = "p2rank"
kind = "tool"
version = "2.5.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/p2rank"

[command]
name = "taf-p2rank"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/p2rank:2.5.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["structural-biology", "protein-structure", "pocket-prediction", "ligand-binding", "drug-discovery", "machine-learning"]
keywords = ["p2rank", "prank", "binding site", "ligand binding", "protein pocket", "pocket prediction", "pocket rescoring", "fpocket", "PDB", "mmCIF", "BioJava"]
description = "P2Rank 2.5.1 protein ligand-binding site prediction runtime with prank and bundled fpocket helper for fpocket-rescore."

[upstream]
name = "P2Rank"
type = "github"
repo = "rdk/p2rank"
homepage = "https://github.com/rdk/p2rank"
manual = "https://github.com/rdk/p2rank/blob/2.5.1/README.md"
release_url = "https://github.com/rdk/p2rank/releases/tag/2.5.1"
downloads = "https://github.com/rdk/p2rank/releases/download/2.5.1/p2rank_2.5.1.tar.gz"
version = "2.5.1"
commit = "9808a7723be9a94e2ffc21ab5f724cb6ae4ba01e"
license = "MIT"
citation = "Krivak R, Hoksza D. P2Rank: machine learning based tool for rapid and accurate prediction of ligand binding sites from protein structure. Journal of Cheminformatics. 2018;10:39."
doi = "10.1186/s13321-018-0285-8"
pmid = "30105488"
watch = "manual"

[smoke]
backend = "docker"
timeout = 300
exist = ["prank", "java", "fpocket", "bash", "grep", "sed", "ldd"]
test = ["grep -Fx \"P2Rank 2.5.1\" /opt/p2rank/source.txt >/dev/null && grep -F \"d243f2d9036ac053fefb9407b5fe1c85f4fe077c519fd975ac585e995feab274\" /opt/p2rank/source.txt >/dev/null && grep -Fx \"fpocket 4.2.3\" /opt/fpocket/share/doc/fpocket/source.txt >/dev/null", "prank -v 2>&1 | grep -F \"P2Rank 2.5.1\" >/dev/null && { prank help 2>&1 || true; } | grep -F \"predict pockets\" >/dev/null && { prank help 2>&1 || true; } | grep -F \"eval-rescore\" >/dev/null", "ldd \"$(command -v fpocket)\" 2>&1 | grep -F \"not found\" && exit 1 || true", "tmp=/tmp/taf-p2rank-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; grep -v '^HETATM' /opt/p2rank/test_data/1fbl.pdb > \"$tmp/1fbl_nohet.pdb\"; prank predict -visualizations 0 -threads 1 -o \"$tmp/predict\" -f \"$tmp/1fbl_nohet.pdb\" > \"$tmp/predict.log\" 2>&1; test -s \"$tmp/predict/1fbl_nohet.pdb_predictions.csv\"; test -s \"$tmp/predict/1fbl_nohet.pdb_residues.csv\"; grep -F \"pocket1\" \"$tmp/predict/1fbl_nohet.pdb_predictions.csv\" >/dev/null; if grep -F \"Could not download\" \"$tmp/predict.log\"; then exit 1; fi; rm -rf \"$tmp\"", "tmp=/tmp/taf-p2rank-fpocket-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; grep -v '^HETATM' /opt/p2rank/test_data/1fbl.pdb > \"$tmp/1fbl_nohet.pdb\"; printf \"HEADER: protein\\n1fbl_nohet.pdb\\n\" > \"$tmp/mini.ds\"; prank fpocket-rescore \"$tmp/mini.ds\" -visualizations 0 -threads 1 -o \"$tmp/fpocket_rescore\" > \"$tmp/fpocket-rescore.log\" 2>&1; test -s \"$tmp/fpocket_rescore/1fbl_nohet.pdb_rescored.csv\"; test -s \"$tmp/fpocket_rescore/1fbl_nohet.pdb_predictions.csv\"; if grep -F \"Could not download\" \"$tmp/fpocket-rescore.log\"; then exit 1; fi; rm -rf \"$tmp\""]
